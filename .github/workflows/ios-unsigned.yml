name: Build iOS Unsigned IPA (Sideloadly)
on:
  workflow_dispatch:

jobs:
  ios-unsigned:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      - name: Install dependencies
        run: npm install
      - name: Initialize iOS project
        run: npm run tauri ios init -- --ci
      # Force Xcode signing off for the whole archive build, not only Tauri's
      # export stage. The xcconfig applies to xcodebuild launched by Tauri.
      # No Apple credentials are needed here: Sideloadly signs the finished IPA.
      - name: Configure unsigned Xcode archive
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/mangahub-unsigned.xcconfig" <<'XCCONFIG'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM =
          XCCONFIG
      - name: Build unsigned iOS archive
        env:
          XCODE_XCCONFIG_FILE: ${{ runner.temp }}/mangahub-unsigned.xcconfig
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri ios build -- --target aarch64 --no-sign --archive-only --ci

      - name: Create unsigned IPA for Sideloadly
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find src-tauri/gen/apple/build -type d -path '*/Products/Applications/*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo 'iOS .app not found in .xcarchive'; exit 1
          fi
          mkdir -p ipa/Payload
          ditto "$APP" "ipa/Payload/$(basename "$APP")"
          cd ipa
          zip -qry ../MangaHub-iOS-unsigned.ipa Payload
          cd ..
          unzip -t MangaHub-iOS-unsigned.ipa | tail -2
      - uses: actions/upload-artifact@v4
        with:
          name: MangaHub-iOS-Unsigned-IPA
          path: MangaHub-iOS-unsigned.ipa
          if-no-files-found: error
