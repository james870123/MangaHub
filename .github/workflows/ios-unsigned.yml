name: Build iOS Unsigned IPA (Sideloadly)
on:
  workflow_dispatch:

jobs:
  ios-unsigned:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      - name: Record build environment
        shell: bash
        run: |
          mkdir -p ios-build-logs
          {
            xcodebuild -version
            xcode-select -p
            rustc --version
            cargo --version
            node --version
          } 2>&1 | tee ios-build-logs/environment.log
      - name: Install dependencies
        run: npm ci || npm install
      - name: Initialize iOS project
        run: npm run tauri ios init -- --ci
      - name: Prepare unsigned Xcode archive settings
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/mangahub-unsigned.xcconfig" <<'XCCONFIG'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM =
          XCCONFIG
      - name: Check iOS Rust library before Xcode archive
        shell: bash
        run: |
          set -o pipefail
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios --lib -v 2>&1 | tee ios-build-logs/cargo-check.log
      - name: Build unsigned iOS archive
        shell: bash
        env:
          XCODE_XCCONFIG_FILE: ${{ runner.temp }}/mangahub-unsigned.xcconfig
        run: |
          set -o pipefail
          npm run tauri ios build -- --target aarch64 --no-sign --archive-only --ci -v 2>&1 | tee ios-build-logs/tauri-ios-archive.log
      - name: Collect native Xcode diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p ios-build-logs/xcode
          find "$HOME/Library/Developer/Xcode/DerivedData" -type f \( -name '*.xcactivitylog' -o -name '*.xcresult' \) -print 2>/dev/null | head -30 > ios-build-logs/xcode-paths.txt || true
          # Xcode activity logs are saved intact for offline inspection.
          while IFS= read -r path; do
            [ -f "$path" ] || continue
            cp "$path" "ios-build-logs/xcode/$(basename "$(dirname "$path")")-$(basename "$path")" || true
          done < ios-build-logs/xcode-paths.txt
      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MangaHub-iOS-Build-Logs
          path: ios-build-logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Create unsigned IPA for Sideloadly
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find src-tauri/gen/apple/build -type d -path '*/Products/Applications/*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo 'iOS .app not found in .xcarchive'; exit 1
          fi
          mkdir -p ipa/Payload
          ditto "$APP" "ipa/Payload/$(basename "$APP")"
          ( cd ipa && zip -qry ../MangaHub-iOS-unsigned.ipa Payload )
          unzip -t MangaHub-iOS-unsigned.ipa | tail -2
      - uses: actions/upload-artifact@v4
        with:
          name: MangaHub-iOS-Unsigned-IPA
          path: MangaHub-iOS-unsigned.ipa
          if-no-files-found: error
