[package]
name = "mangahub"
version = "0.5.8"
description = "MangaHub reader"
authors = ["MangaHub contributors"]
edition = "2021"
build = "build.rs"

[lib]
name = "mangahub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }
scraper = "0.22"
url = "2"

tauri-plugin-opener = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
